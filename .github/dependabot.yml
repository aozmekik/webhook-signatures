version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      provider-sdks:
        patterns:
          - '@octokit/*'
          - '@paddle/*'
          - '@shopify/*'
          - '@slack/*'
          - resend
          - standardwebhooks
          - stripe
          - svix
          - twilio
      tooling:
        patterns:
          - '*'
        exclude-patterns:
          - '@octokit/*'
          - '@paddle/*'
          - '@shopify/*'
          - '@slack/*'
          - resend
          - standardwebhooks
          - stripe
          - svix
          - twilio
    ignore:
      # typescript-eslint supports TypeScript < 6.1; upgrade both together.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # The types follow the oldest supported Node.js release (engines: >=22).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
